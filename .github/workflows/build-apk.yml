name: Build Edy P2P Chat APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            python3-virtualenv

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Prepare Buildozer Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            curl -L \
              "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
              -o /tmp/android-tools.zip

            rm -rf /tmp/android-cmdline-tools

            mkdir -p /tmp/android-cmdline-tools

            unzip -q \
              /tmp/android-tools.zip \
              -d /tmp/android-cmdline-tools

            rm -rf "$SDK/cmdline-tools/latest"

            mkdir -p "$SDK/cmdline-tools/latest"

            cp -r \
              /tmp/android-cmdline-tools/cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking AIDL..."

          test -f \
            "$SDK/build-tools/35.0.0/aidl"

          echo "AIDL FOUND:"
          "$SDK/build-tools/35.0.0/aidl" --version

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edy-P2P-Chat-APK
          path: bin/*.apk
          if-no-files-found: error
